name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 构建环境
        type: choice
        options:
          - test
          - dev
          - pro
        default: test

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package (${{ github.event.inputs.environment }})
        run: |
          npx vite build --mode ${{ github.event.inputs.environment }}
          npx electron-builder --win --publish=never

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.environment || github.event.inputs.environment }}-${{ github.run_number }}
          name: Windows ${{ github.event.inputs.environment }} #${{ github.run_number }}
          body: |
            毫米波雷达 Windows 桌面版
            环境: ${{ github.event.inputs.environment }}
            构建时间: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            build-electron/*.exe
